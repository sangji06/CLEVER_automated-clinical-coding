[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clever-kcd"
version = "0.1.0"
description = "Guideline-driven automated clinical coding framework for KCD code assignment."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "boto3",
  "botocore",
  "faiss-cpu",
  "langchain-community",
  "langchain-core",
  "langchain-huggingface",
  "openpyxl",
  "pandas",
  "sentence-transformers",
  "torch",
  "transformers"
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest"]
